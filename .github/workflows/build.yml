name: Windows build and security gates
on:
  push:
    branches: [main]
    tags: ['v*', 'preview-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myaccounts-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CGO_ENABLED: '0'
      GODEBUG: http2client=0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
      - name: Build embedded frontend
        shell: pwsh
        run: |
          cd web
          npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx --yes yarn@1.22.22 typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx --yes yarn@1.22.22 build
          exit $LASTEXITCODE
      - name: Download pinned Go modules
        shell: pwsh
        run: |
          $downloaded=$false
          for ($attempt=0; $attempt -lt 3; $attempt++) {
            go mod download
            if (!$LASTEXITCODE) { $downloaded=$true; break }
            Start-Sleep -Seconds 5
          }
          if (!$downloaded) { throw 'Pinned module download failed after retries' }
      - name: Test and build
        shell: pwsh
        run: |
          go test ./internal/portable ./cred .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./internal/portable .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:CGO_ENABLED='0'
          New-Item -ItemType Directory dist -Force | Out-Null
          $buildVersion='0.1.0-dev'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $buildVersion=$env:GITHUB_REF_NAME.TrimStart('v') }
          go build -trimpath -ldflags "-s -w -X main.version=$buildVersion" -o dist/MyAccounts-windows-amd64.exe .
          exit $LASTEXITCODE
      - name: Native executable smoke
        shell: pwsh
        run: |
          npm ci --prefix integration --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:MYACCOUNTS_PLAYWRIGHT=(Resolve-Path integration/node_modules/@playwright/test/index.mjs).Path
          ./scripts/smoke.ps1 -Exe ./dist/MyAccounts-windows-amd64.exe -OIDC
      - name: SBOM and checksum
        shell: pwsh
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 mod -licenses -json -output dist/SBOM.cdx.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $hash=(Get-FileHash dist/MyAccounts-windows-amd64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MyAccounts-windows-amd64.exe" | Set-Content dist/SHA256SUMS.txt
          Copy-Item LICENSE,NOTICE,docs/release-acceptance.json dist/
          Copy-Item docs/preview-release.md dist/KNOWN-LIMITATIONS.md
      - name: Verify release acceptance
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $acceptance=Get-Content docs/release-acceptance.json -Raw | ConvertFrom-Json
          if (!$acceptance.approved -or ($acceptance.gates | Where-Object { !$_.passed -or !$_.evidence }).Count) { throw 'Release blocked: incomplete acceptance evidence' }
      - name: Stage verified release files
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/preview-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag=$env:GITHUB_REF_NAME
          $draft=gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft --prerelease --title "MyAccounts $tag" --notes-file docs/preview-release.md
            if ($LASTEXITCODE) { throw 'Draft release creation failed' }
          } elseif ($draft -ne 'true') { throw 'Refusing to replace a published release' }
          gh release upload $tag dist/MyAccounts-windows-amd64.exe dist/SHA256SUMS.txt dist/SBOM.cdx.json dist/LICENSE dist/NOTICE dist/KNOWN-LIMITATIONS.md dist/release-acceptance.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE) { throw 'Draft release asset upload failed' }
  audit:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GOMEMLIMIT: 5GiB
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Build pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Analyze Windows source and dependencies
        timeout-minutes: 45
        run: GOOS=windows GOARCH=amd64 "$(go env GOPATH)/bin/govulncheck" ./...
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/preview-')
    needs: [windows, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify uploaded executable and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist
          (cd dist && sha256sum -c SHA256SUMS.txt)
          test -s dist/SBOM.cdx.json
          test -s dist/KNOWN-LIMITATIONS.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true
